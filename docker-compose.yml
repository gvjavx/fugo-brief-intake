services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fugo
      POSTGRES_PASSWORD: fugo
      POSTGRES_DB: fugo
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fugo"]
      interval: 2s
      retries: 15

  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run db:migrate && npm run dev -- --host"
    environment:
      DATABASE_URL: postgres://fugo:fugo@db:5432/fugo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fugo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
